name: Android Build
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npx expo install --check

      - name: Install SVG converter
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Convert SVG branding to PNG
        run: |
          rsvg-convert -w 1024 -h 1024 assets/bizreel-logo.svg -o assets/icon.png
          rsvg-convert -w 1024 -h 1024 assets/bizreel-logo.svg -o assets/adaptive-icon.png
          rsvg-convert -w 2000 -h 2000 -b black assets/bizreel-logo.svg -o assets/splash.png

      - name: Create .env file
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=https://naaxpbiipychzoisqumf.supabase.co" >> .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5hYXhwYmlpcHljaHpvaXNxdW1mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5NDczMjMsImV4cCI6MjA5NDUyMzMyM30.InpPLwi7c18g8eGCtqvlOdmYIVVUf-Byx_2-BwUG0PE" >> .env
          echo "EXPO_PUBLIC_AGORA_APP_ID=b7ba162dd6c7400ca34fdfcfb07ecb33" >> .env
          echo "EXPO_PUBLIC_INTASEND_PUBLISHABLE_KEY=ISPubKey_live_17af08d1-3287-485a-8bd7-d519e38c7220" >> .env

      - name: Prebuild Native Folders
        run: npx expo prebuild --platform android --no-install

      - name: Build Android APK
        run: |
          export NODE_OPTIONS="--max-old-space-size=4096"
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bizreel-apk
          path: android/app/build/outputs/apk/release/*.apk
