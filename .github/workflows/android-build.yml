name: Android Build
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Create .env file
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=https://naaxpbiipychzoisqumf.supabase.co" >> .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5hYXhwYmlpcHljaHpvaXNxdW1mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5NDczMjMsImV4cCI6MjA5NDUyMzMyM30.InpPLwi7c18g8eGCtqvlOdmYIVVUf-Byx_2-BwUG0PE" >> .env
          echo "EXPO_PUBLIC_AGORA_APP_ID=b7ba162dd6c7400ca34fdfcfb07ecb33" >> .env

      - name: Prebuild Native Folders
        run: npx expo prebuild --platform android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bizreel-apk
          path: android/app/build/outputs/apk/release/*.apk
