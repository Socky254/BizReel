name: Android Build
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npx expo install --check

      - name: 'Health Check: Type Check'
        run: npm run type-check

      - name: 'Health Check: Lint'
        run: npm run lint

      - name: Install SVG converter
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Convert SVG branding to PNG
        run: |
          rsvg-convert -w 1024 -h 1024 assets/bizreel-logo.svg -o assets/icon.png
          rsvg-convert -w 1024 -h 1024 assets/bizreel-logo.svg -o assets/adaptive-icon.png
          rsvg-convert -w 2000 -h 2000 -b black assets/bizreel-logo.svg -o assets/splash.png

      - name: Create .env file
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
          echo "EXPO_PUBLIC_AGORA_APP_ID=${{ secrets.AGORA_APP_ID }}" >> .env
          echo "EXPO_PUBLIC_INTASEND_PUBLISHABLE_KEY=${{ secrets.INTASEND_PUBLISHABLE_KEY }}" >> .env

      - name: Prebuild Native Folders
        run: npx expo prebuild --platform android --no-install

      - name: Build Android APK (Release)
        run: |
          export NODE_OPTIONS="--max-old-space-size=4096"
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bizreel-apk
          path: android/app/build/outputs/apk/release/*.apk
